services:
  bot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - bot-data:/app/data
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 2g
    cpus: 2

volumes:
  bot-data:
